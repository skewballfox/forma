# User hands the component to the materia of that account, so its containers
# run rootless (docs/architecture.md 2.4). The repository manifest declares the
# account under [Forma.Accounts.moonshine].
# The scripts still run as root: materia runs them at the moments forma needs
# (docs/architecture.md 2.3), and requires SetupScript and CleanupScript
# together.
[Settings]
User = "moonshine"
SetupScript = "forma-apply.sh"
PostScript = "forma-apply.sh"
CleanupScript = "forma-revert.sh"

[[Services]]
Service = "nvidia-driver-volume.service"
Oneshot = true

# Same account as the moonshine component, declared once in the repository
# manifest. The ledger records both components as needing it, and keeps it
# until neither is installed.

[[Forma.Images]]
Tag = "moonshine/nvidia-driver:latest"
Containerfile = "build/nvidia-driver.Dockerfile"
Context = "build"
BuildArgs = { NV_VERSION = "580.95.05" }

[Forma.Images.Update]
Schedule = "weekly"
Triggers = ["base-digest"]
