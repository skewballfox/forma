# Repository manifest. Materia reads Hosts and Roles; forma also reads the
# [Forma] tables, which materia ignores.

[Roles.streaming]
Components = ["nvidia-driver", "moonshine"]

[Hosts.forge]
Roles = ["streaming"]

# Per-host forma settings
[Hosts.forge.Forma]
Signing = "tpm"

# Same replace semantics as materia's Overrides: this replaces the
# component's whole Images list for this host (here, to match this host's
# NVIDIA driver).
[[Hosts.forge.Overrides.nvidia-driver.Forma.Images]]
Tag = "moonshine/nvidia-driver:latest"
Containerfile = "build/nvidia-driver.Dockerfile"
Context = "build"
BuildArgs = { NV_VERSION = "580.105.08" }

# Same extend semantics as materia's Extensions: merges into the component's
# [Forma] table for this host.
[Hosts.forge.Extensions.moonshine.Forma.Update]
Schedule = "Sun *-*-* 04:00:00"

# Settings shared by every host
[Forma]
Signing = "auto"

[Forma.Builder]
Account = "forma-build"
SubIds = 65536

[Forma.Signer]
Account = "forma-sign"

[Forma.Store]
Root = "/var/lib/forma/store"

# Base image requirements for every host. These add to the host's
# policy.json; they can never loosen it.
[Forma.BaseImages]
# listed: base images that match a Trust scope must satisfy it.
Require = "listed"

[[Forma.BaseImages.Trust]]
Scope = "registry.fedoraproject.org"
Type = "sigstore-key"
# Repository path. apply installs it and pins its fingerprint.
Key = "trust/fedora-registry.pub"

[[Forma.BaseImages.Trust]]
Scope = "quay.io/fedora"
Type = "sigstore-keyless"
Issuer = "https://accounts.google.com"
Subject = "release@fedoraproject.org"

# Service accounts that several components share, declared once. The key is
# the account's name. A component runs as one by setting [Settings] User to
# that name, and must not declare it again under [Forma.Account]. Forma
# creates an account only on a host where an installed component runs as it.
[Forma.Accounts.moonshine]
Home = true
Linger = true
SubIds = 65536
# Supplementary groups. Each must exist on the host already (render) or be
# declared to forma under [Forma.Groups] (moonshine-input). Forma never
# creates, changes or removes a group it did not create.
MemberOf = ["render", "moonshine-input"]

# No component on forge runs as this one, so forma creates neither it nor
# its group there.
[Forma.Accounts.backup]
MemberOf = ["backup-readers"]

# Groups declared once. Forma creates one only where an account it creates
# joins it, and removes it when none does.
# /dev/uinput and /dev/uhid belong to moonshine-input, not to input.
[Forma.Groups.moonshine-input]
System = true

[Forma.Groups.backup-readers]
