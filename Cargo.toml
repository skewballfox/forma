[package]
name = "forma"
version.workspace = true
edition.workspace = true
description = "Builds, signs and stages local container images and the service accounts that run them, alongside materia"
publish = false

[workspace]
resolver = "3"
members = [".", "crates/config", "crates/ledger", "crates/plan", "crates/privilege", "crates/process", "crates/quadlet", "crates/signing/payload", "crates/signing/trust", "crates/user"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
forma-config = { path = "crates/config" }
forma-ledger = { path = "crates/ledger" }
forma-plan = { path = "crates/plan" }
forma-privilege = { path = "crates/privilege" }
forma-process = { path = "crates/process" }
forma-quadlet = { path = "crates/quadlet" }
forma-signing-payload = { path = "crates/signing/payload" }
forma-signing-trust = { path = "crates/signing/trust" }
forma-user = { path = "crates/user", default-features = false }

anyhow = "1.0.104"
base64 = "0.22.1"
cap-std = "4.0.3"
clap = { version = "4.6.7", features = ["derive"] }
caps = "0.5.6"
# 0.14 is a new major release; stay on the line the RustCrypto 0.10 hashes go with.
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pem", "std"] }
nix = { version = "0.31.3", default-features = false }
serde_json = "1.0.154"
sha2 = "0.10.9"
serde = { version = "1.0.229", features = ["derive"] }
rustix = { version = "1.1.5", default-features = false, features = ["std"] }
thiserror = "2.0.21"
toml = "1.2.0"
tracing = "0.1.44"
# libudev bindings; needs libudev at build time (systemd-devel on Fedora).
udev = "0.9.3"
zeroize = "1.9.1"
# 6.0 is three days old and drops the blocking API; stay on 5.x for now.
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

# Test-only
insta = "1.49.0"
proptest = "1.12.0"
rstest = "0.28.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
cap-std.workspace = true
clap.workspace = true
forma-config.workspace = true
forma-ledger.workspace = true
forma-plan.workspace = true
forma-user.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
