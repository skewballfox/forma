# The guest for the forma-user tests that need root. `just vm-image` builds
# it; see PLAN.md section 10.3.

[Distribution]
Distribution=fedora
Release=44

[Output]
Format=disk
ImageId=forma-user-test
Output=forma-user-test
OutputDirectory=mkosi.output

[Build]
CacheDirectory=mkosi.cache

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=no
# No root password and no login: the guest only runs the test unit.
Autologin=no
RootPassword=hashed:*
# Answer systemd-firstboot's questions at build time so the guest never stops
# to ask them, and turn the prompt off in case one is missed.
Timezone=UTC
Locale=C.UTF-8
Keymap=us
Hostname=forma-user-test
# Headless: no getty, so no login prompt, and a quiet boot, so the console
# shows the test output and nothing else. `just vm-test --debug` streams the
# journal to the console to see what the guest did.
KernelCommandLine=systemd.firstboot=off systemd.mask=getty.target systemd.mask=console-getty.service quiet loglevel=0 systemd.show_status=no
Packages=
        acl
        dbus-broker
        kernel-core
        kernel-modules
        kmod
        nss-altfiles
        shadow-utils
        systemd
        systemd-pam
        systemd-boot-unsigned
        systemd-udev
        util-linux-core
