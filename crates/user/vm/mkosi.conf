# The guest for the forma-user tests that need root. `just user::vm-image`
# builds it; see PLAN.md section 10.3. The runner, the boot settings and the
# base packages come from the shared base in vm/base at the repository root.

[Include]
Include=../../../vm/base

[Output]
Format=disk
ImageId=forma-user-test
Output=forma-user-test
OutputDirectory=mkosi.output

[Build]
CacheDirectory=mkosi.cache

[Content]
Hostname=forma-user-test
# What forma-user's tests touch: ACLs, kernel modules, the vendor group file
# (nss-altfiles reads /usr/lib/group) and shadow-utils. mkosi.extra/ adds the
# marker the tests look for (/etc/forma-user-test-vm), the vendor group, the
# nsswitch.conf that reads it, and the base directory the tests work in.
Packages=
        acl
        kmod
        nss-altfiles
        shadow-utils
