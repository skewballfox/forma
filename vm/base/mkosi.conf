# The part of every forma test guest that does not depend on the crate under
# test. A crate's vm/mkosi.conf includes this directory first, then adds its
# own packages, files and marker:
#
#   [Include]
#   Include=../../../vm/base
#
# mkosi reads an included directory as its own: this mkosi.conf, and
# mkosi.extra/ next to it. Lists such as Packages= add up. Paths here are
# relative to this directory, so the crate keeps its own Output and cache
# settings. mkosi copies the crate's mkosi.extra/ first and this one after it
# (mkosi 26), so a file must be in only one of the two trees.
#
# mkosi.extra/ holds the test runner: forma-vm-test.service starts
# /usr/local/bin/forma-vm-run at boot, which runs the binary shared at
# /mnt/forma-test and writes its result to /mnt/forma-out. See crates/common.just.

[Distribution]
Distribution=fedora
Release=44

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=no
# No root password and no login: the guest only runs the test unit.
Autologin=no
RootPassword=hashed:*
# Answer systemd-firstboot's questions at build time so the guest never stops
# to ask them, and turn the prompt off in case one is missed.
Timezone=UTC
Locale=C.UTF-8
Keymap=us
# Headless: no getty, so no login prompt, and a quiet boot, so the console
# shows the test output and nothing else. `just vm-test --debug` streams the
# journal to the console to see what the guest did.
KernelCommandLine=systemd.firstboot=off systemd.mask=getty.target systemd.mask=console-getty.service quiet loglevel=0 systemd.show_status=no
Packages=
        dbus-broker
        kernel-core
        kernel-modules
        systemd
        systemd-pam
        systemd-boot-unsigned
        systemd-udev
        util-linux-core
