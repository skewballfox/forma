# A Fedora 44 guest with secureblue's SELinux policy: the properties of a
# secureblue host that forma's notes depend on, and only those. Built with
# `just secureblue::vm-image`; README.md says what it has and lacks.

[Include]
Include=../base

[Output]
Format=disk
ImageId=forma-secureblue-test
Output=forma-secureblue-test
OutputDirectory=mkosi.output

[Build]
CacheDirectory=mkosi.cache

[Content]
Hostname=forma-secureblue-test
# No labelling on the host: secureblue's userns_deny_unconfined_relabels
# lets only init_t and kernel_t give a file a type such as
# container_runtime_exec_t or passt_exec_t, so the host refuses mkosi's
# setfiles. The image labels itself instead, on one boot of its own kernel
# that vm-image runs after the build (label-image, forma-relabel.service), and
# is enforcing on every boot after that (/etc/selinux/config).
SELinuxRelabel=no
KernelCommandLine=selinux=1
Packages=
        # The policy, and secureblue's modules' dependencies: pasta_t comes
        # from passt-selinux; bubblewrap_role from secureblue's
        # bubblewrap-selinux (their COPR, in mkosi.sandbox).
        selinux-policy-targeted
        container-selinux
        passt
        passt-selinux
        bubblewrap
        bubblewrap-selinux
        # To build the .te modules and install them, as secureblue does.
        selinux-policy-devel
        make
        policycoreutils
        policycoreutils-python-utils
        # To read the policy back in the guest (check).
        setools-console
        libselinux-utils
        # What forma's checks on this guest run: accounts, ACLs, rootless containers.
        shadow-utils
        acl
        podman
        buildah
        crun
